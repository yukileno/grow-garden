<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7ed">
  <meta name="description" content="算数の問題に正解してシェックルを集め、3Dの農園で作物を育てよう。">
  <title>こもれび農園</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="world.css">
  <script defer src="catalog.js"></script>
  <script defer src="garden.js"></script>
  <script defer src="math.js"></script>
  <script defer src="app.js"></script>
  <script type="module" src="world.mjs"></script>
</head>
<body>
  <div id="gameplay">
  <div id="world" aria-label="3D農園ワールド"></div>
  <nav class="travel" aria-label="ワープ">
    <button data-travel="seeds">種屋</button><button data-travel="garden">わたしの畑</button><button data-travel="sell">売却所</button><button data-world="math">算数教室</button>
  </nav>
  <aside class="world-info">
    <button class="world-button" data-world="market" aria-label="村のお店">🛒</button>
    <div class="world-weather" id="world-weather"></div>
    <div class="world-weather" id="play-time" role="timer" aria-label="農園で遊べる残り時間"></div>
  </aside>
  <aside class="world-controls"><button class="world-button" data-world="help" aria-label="遊び方">?</button><span>WASD 移動<br>ドラッグ 視点<br>E アクション</span></aside>
  <button id="interact" class="interact" hidden></button>
  <div class="world-bottom">
    <div class="world-money" id="world-money"></div>
    <div id="hotbar" class="hotbar" aria-label="持ち物"></div>
  </div>
  <div class="touch-controls" aria-label="移動操作">
    <button data-move="w" aria-label="前">▲</button>
    <button data-move="a" aria-label="左">◀</button>
    <button data-move="s" aria-label="後">▼</button>
    <button data-move="d" aria-label="右">▶</button>
    <button class="jump" data-move="jump" aria-label="ジャンプ">⤒</button>
  </div>
  <div id="interface" hidden>
  <header class="topbar">
    <div class="frame topinner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">🌱</span><span>こもれび農園</span></div>
      <div class="top-actions">
        <div class="balance"><span class="coin" aria-hidden="true">◈</span><span><b id="balance">0</b><small>シェックル</small></span></div>
        <button class="help-button" data-action="help" aria-label="遊び方">?</button>
        <button class="help-button" data-world="close" aria-label="メニューを閉じる">×</button>
      </div>
    </div>
  </header>
  <main class="frame">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-text">
        <h1 id="hero-title">こもれび農園</h1>
        <p>種を植えて、時間とともに育つ小さな農園。</p>
      </div>
      <div class="weather" id="weather"></div>
    </section>
    <div class="dashboard">
      <section class="panel garden" aria-labelledby="garden-title">
        <div class="section-head">
          <div class="section-title"><span class="section-icon green" aria-hidden="true">🌿</span><div><h2 id="garden-title">わたしの畑</h2><p id="plot-count"></p></div></div>
          <button class="soft-button" data-action="harvest-all">収穫できる作物を取る</button>
        </div>
        <div class="plots" id="plots"></div>
        <div class="seed-tray">
          <div class="section-title"><span class="section-icon tan" aria-hidden="true">🧺</span><div><h3>種のバッグ</h3><p>種を選んで空き区画を押す</p></div></div>
          <div class="seed-options" id="seeds"></div>
        </div>
        <div class="effects" id="effects" hidden></div>
      </section>
      <aside class="panel market" aria-labelledby="market-title">
        <div class="section-head">
          <div class="section-title"><span class="section-icon tan" aria-hidden="true">🏡</span><div><h2 id="market-title">種屋</h2><p id="shop-summary"></p></div></div>
          <div class="restock"><small>次の入荷</small><b id="restock">--:--</b></div>
        </div>
        <nav class="market-tabs" aria-label="お店の種類">
          <button data-action="tab" data-key="seeds" aria-pressed="true">🌱 種屋</button>
          <button data-action="tab" data-key="gear" aria-pressed="false">🛠️ 道具屋</button>
          <button data-action="tab" data-key="eggs" aria-pressed="false">🥚 卵屋</button>
        </nav>
        <div class="shop-list" id="shop"></div>
      </aside>
      <section class="panel basket" aria-labelledby="basket-title">
        <div class="section-head">
          <div class="section-title"><span class="section-icon tan" aria-hidden="true">🧺</span><div><h2 id="basket-title">収穫かご</h2><p id="basket-count"></p></div></div>
          <button class="primary-button" id="sell" data-action="sell">まとめて売る</button>
        </div>
        <div id="basket-items" class="basket-items"></div>
      </section>
    </div>
    <footer><span>🌱 こもれび農園</span><span id="save-label">このブラウザに自動保存</span></footer>
  </main>
  </div>
  </div>
  <section id="play-lock" class="play-lock" aria-labelledby="play-lock-title" hidden>
    <div class="play-lock-card">
      <h2 id="play-lock-title">農園の持ち時間がなくなりました</h2>
      <p>算数に1問正解すると、あと30秒遊べます。</p>
      <button class="primary-button" data-action="open-math">算数を解く</button>
    </div>
  </section>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
